[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "Track your spending from the command line, stored in SQLite."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Om Patel" }]
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
expense = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
